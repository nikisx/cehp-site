<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wowTitle wowDesc" font-family="'Open Sans','Segoe UI',Tahoma,sans-serif">
  <title id="wowTitle">Our Ways of Working</title>
  <desc id="wowDesc">Wheel diagram: an outer ring of five strategic priorities surrounds three interlocking puzzle pieces around a central goal of sustainable, leveraged growth.</desc>

  <circle cx="500" cy="500" r="448" fill="none" stroke="#4ec6c1" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Outer ring: 5 strategic priorities -->
  <g fill="#1a3a5c" stroke="#4ec6c1" stroke-width="1.5">
    <path d="M 500.00 242.00 L 500.00 70.00 A 430.0 430.0 0 0 1 908.95 367.12 L 745.37 420.27 A 258.0 258.0 0 0 0 500.00 242.00 Z"/>
    <path d="M 745.37 420.27 L 908.95 367.12 A 430.0 430.0 0 0 1 752.75 847.88 L 651.65 708.73 A 258.0 258.0 0 0 0 745.37 420.27 Z"/>
    <path d="M 651.65 708.73 L 752.75 847.88 A 430.0 430.0 0 0 1 247.25 847.88 L 348.35 708.73 A 258.0 258.0 0 0 0 651.65 708.73 Z"/>
    <path d="M 348.35 708.73 L 247.25 847.88 A 430.0 430.0 0 0 1 91.05 367.12 L 254.63 420.27 A 258.0 258.0 0 0 0 348.35 708.73 Z"/>
    <path d="M 254.63 420.27 L 91.05 367.12 A 430.0 430.0 0 0 1 500.00 70.00 L 500.00 242.00 A 258.0 258.0 0 0 0 254.63 420.27 Z"/>
  </g>

  <text x="702.2" y="199.7" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
    <tspan x="702.2" font-size="16" font-weight="800">FOCUS on</tspan>
    <tspan x="702.2" dy="19.0">key markets,</tspan>
    <tspan x="702.2" dy="19.0">therapeutic areas</tspan>
    <tspan x="702.2" dy="19.0">&amp; launches</tspan>
  </text>
  <text x="827.2" y="584.3" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
    <tspan x="827.2" font-size="16" font-weight="800">DEVELOP</tspan>
    <tspan x="827.2" dy="19.0">the TALENT</tspan>
    <tspan x="827.2" dy="19.0">&amp; culture</tspan>
    <tspan x="827.2" dy="19.0">we need</tspan>
  </text>
  <text x="500.0" y="850.5" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
    <tspan x="500.0" font-size="18" font-weight="800">LEAD policy efforts</tspan>
  </text>
  <text x="172.8" y="584.3" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
    <tspan x="172.8" font-size="16" font-weight="800">FOCUS on</tspan>
    <tspan x="172.8" dy="19.0">integrated</tspan>
    <tspan x="172.8" dy="19.0">business</tspan>
    <tspan x="172.8" dy="19.0">strategies</tspan>
  </text>
  <text x="297.8" y="209.2" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
    <tspan x="297.8" font-size="16" font-weight="800">TRANSFORM</tspan>
    <tspan x="297.8" dy="19.0">operating</tspan>
    <tspan x="297.8" dy="19.0">model</tspan>
  </text>

  <!-- Inner puzzle: 3 interlocking pieces -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <path d="M 441.11 534.00 L 384.82 566.50 A 17.0 17.0 0 0 1 355.37 583.50 L 299.08 616.00 A 232.0 232.0 0 0 1 500.00 268.00 L 500.00 333.00 A 17.0 17.0 0 0 0 500.00 367.00 L 500.00 432.00 A 68.0 68.0 0 0 0 441.11 534.00 Z" fill="#149180"/>
    <path d="M 500.00 432.00 L 500.00 367.00 A 17.0 17.0 0 0 1 500.00 333.00 L 500.00 268.00 A 232.0 232.0 0 0 1 700.92 616.00 L 644.63 583.50 A 17.0 17.0 0 0 0 615.18 566.50 L 558.89 534.00 A 68.0 68.0 0 0 0 500.00 432.00 Z" fill="#0e8ab0"/>
    <path d="M 558.89 534.00 L 615.18 566.50 A 17.0 17.0 0 0 1 644.63 583.50 L 700.92 616.00 A 232.0 232.0 0 0 1 299.08 616.00 L 355.37 583.50 A 17.0 17.0 0 0 0 384.82 566.50 L 441.11 534.00 A 68.0 68.0 0 0 0 558.89 534.00 Z" fill="#1a7a3a"/>
  </g>

  <text x="370.1" y="413.8" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
    <tspan x="370.1" font-size="14" font-weight="800">DIFFERENTIATE</tspan>
    <tspan x="370.1" dy="17.0">through</tspan>
    <tspan x="370.1" dy="17.0">DIGITAL &amp; DATA</tspan>
  </text>
  <text x="629.9" y="405.3" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
    <tspan x="629.9" font-size="14" font-weight="800">EXPAND access</tspan>
    <tspan x="629.9" dy="17.0">through VALUE</tspan>
    <tspan x="629.9" dy="17.0">demonstration &amp;</tspan>
    <tspan x="629.9" dy="17.0">AFFORDABILITY</tspan>
  </text>
  <text x="500.0" y="630.3" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
    <tspan x="500.0" font-size="14" font-weight="800">CREATE</tspan>
    <tspan x="500.0" dy="17.0">Industry-leading</tspan>
    <tspan x="500.0" dy="17.0">PATIENT-FOCUSED</tspan>
    <tspan x="500.0" dy="17.0">customer experience</tspan>
  </text>

  <!-- Centre: the goal -->
  <circle cx="500" cy="500" r="68" fill="#1b8a3a" stroke="#ffffff" stroke-width="4"/>
  <text x="500.0" y="487.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">
    <tspan x="500.0" font-size="13" font-weight="700">Sustainable,</tspan>
    <tspan x="500.0" dy="19.0" font-size="13" font-weight="700">leveraged</tspan>
    <tspan x="500.0" dy="19.0" font-size="18" font-weight="800">GROWTH</tspan>
  </text>
</svg>
